   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="28.7928" y="103.859038" transform="rotate(-0 28.7928 103.859038)">Planning question</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial'; text-anchor: start; fill: #0072b2" x="272.379888" y="103.859038" transform="rotate(-0 272.379888 103.859038)">Feasibility assessment (before the trial)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="669.336624" y="103.859038" transform="rotate(-0 669.336624 103.859038)">What subsequently occurred</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="163.615696" transform="rotate(-0 33.303672 163.615696)">Is recruitment demanding?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 157.085306)">Planned 454/year = 92nd percentile of comparable trials;</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 170.146087)">8% chance of finishing in 10 months</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 157.085423)">377 enrolled at ≥268/year:</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 170.146204)">upper-tail performance was achieved</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="234.374317" transform="rotate(-0 33.303672 234.374317)">Are the variability assumptions realistic?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 227.844044)">Comparable trials: CV 37% (AUC), 40% (Ctrough)</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 240.904825)">Protocol assumed 50% and 84%</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="673.847496" y="234.377833" transform="rotate(-0 673.847496 234.377833)">Observed CV 36% and 44%</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="305.132938" transform="rotate(-0 33.303672 305.132938)">What safety burden should sites expect?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 298.602664)">Comparable trials: 39.5% with a serious AE</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 311.663211)">(≈149 of 378 patients)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="673.847496" y="305.132938" transform="rotate(-0 673.847496 305.132938)">39.0% / 40.5% (subcutaneous / intravenous)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="375.891676" transform="rotate(-0 33.303672 375.891676)">Is the population composition fixed?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 369.361168)">Simulated eligible pool: 56% women, 9% Asian,</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 382.421949)">5% Hispanic (one global mix)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 369.361285)">29% women, 29% Asian, 31% Hispanic:</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 382.421832)">recruitment geography shaped the mix</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="446.650296" transform="rotate(-0 33.303672 446.650296)">Will the required PK numbers be retained?</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 440.119906)">P(AUC 0-6 weeks ≥ 318) 100%; P(Ctrough ≥ 240) 61%</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 453.180687)">at 378 enrolled</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="673.847496" y="446.650179" transform="rotate(-0 673.847496 446.650179)">371 / 303 evaluable (AUC / Ctrough)</text>
   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 19px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="38.3904" y="34.616807" transform="rotate(-0 38.3904 34.616807)">Retrospective evaluation of pre-trial feasibility signals in NCT05722015</text>
  </g>
