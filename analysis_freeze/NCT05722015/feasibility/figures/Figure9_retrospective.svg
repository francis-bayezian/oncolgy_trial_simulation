   </g>
   <text style="font-style: italic; font-size: 14px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="38.3904" y="524.72291" transform="rotate(-0 38.3904 524.72291)">The pre-trial assessment flagged the demanding accrual and gave realistic variability and safety inputs; composition depended on geography.</text>
  </g>
