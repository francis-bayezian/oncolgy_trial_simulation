    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: end" x="280.24992" y="461.846572" transform="rotate(-0 280.24992 461.846572)">Historical controls (meta-analytic)</text>
   </g>
   <g id="text_26">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: end" x="280.24992" y="416.846572" transform="rotate(-0 280.24992 416.846572)">Synthetic control (contextual model)</text>
   </g>
   <g id="text_27">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: middle; fill: #222222" x="443.317714" y="384.75" transform="rotate(-0 443.317714 384.75)">observed control arm 40.5%</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial'; text-anchor: start" x="287.928" y="372" transform="rotate(-0 287.928 372)">Synthetic-control exploration: control-arm serious AE (95% interval)</text>
   </g>
  </g>
  <g id="text_29">
   <text style="font-weight: 700; font-size: 19px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="38.3904" y="34.616807" transform="rotate(-0 38.3904 34.616807)">Feasibility signals compared with what happened in the case-study trial</text>
  </g>
  <g id="text_30">
   <text style="font-size: 11.5px; font-family: 'Arial'; fill: #222222" transform="translate(691.0272 422.45938)">Generating a synthetic control was feasible,</text>
   <text style="font-size: 11.5px; font-family: 'Arial'; fill: #222222" transform="translate(691.0272 434.975962)">but its uncertainty was too wide to</text>
   <text style="font-size: 11.5px; font-family: 'Arial'; fill: #222222" transform="translate(691.0272 447.492544)">support replacing the control arm.</text>
  </g>
