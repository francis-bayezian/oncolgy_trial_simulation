   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="28.7928" y="79.838348" transform="rotate(-0 28.7928 79.838348)">Planning question</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial'; text-anchor: start; fill: #0072b2" x="272.379888" y="79.838348" transform="rotate(-0 272.379888 79.838348)">Feasibility assessment</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="669.336624" y="79.838348" transform="rotate(-0 669.336624 79.838348)">What subsequently occurred</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="120.343124" transform="rotate(-0 33.303672 120.343124)">Is recruitment demanding?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 114.356933)">Planned 454/year = 92nd percentile of comparable trials;</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 126.329315)">8% chance of finishing in 10 months</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 114.35704)">377 enrolled at ≥268/year:</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 126.329423)">upper-tail performance was achieved</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="168.756917" transform="rotate(-0 33.303672 168.756917)">Are the variability assumptions realistic?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 162.770833)">Comparable trials: CV 37% (AUC), 40% (Ctrough)</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 174.743216)">Protocol assumed 50% and 84%</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="673.847496" y="168.76014" transform="rotate(-0 673.847496 168.76014)">Observed CV 36% and 44%</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="217.17071" transform="rotate(-0 33.303672 217.17071)">What safety burden should sites expect?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 211.184626)">Historical arm-level estimate 39.5%;</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 223.156794)">simulated cohort incidence 39.7% (150 of 378)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="673.847496" y="217.17071" transform="rotate(-0 673.847496 217.17071)">39.0% / 40.5% (subcutaneous / intravenous)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="265.584611" transform="rotate(-0 33.303672 265.584611)">Is the population composition fixed?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 259.598312)">Simulated eligible pool: 40% women, 15% Asian,</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 271.570695)">5% Hispanic (one global mix)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 259.598419)">29% women, 29% Asian, 31% Hispanic:</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #222222" transform="translate(673.847496 271.570587)">recruitment geography shaped the mix</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="33.303672" y="313.998404" transform="rotate(-0 33.303672 313.998404)">Will the required PK numbers be retained?</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 308.012212)">P(AUC 0-6 weeks ≥ 318) 100.0%; P(Ctrough ≥ 240) 96.6%</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #0072b2" transform="translate(276.89076 319.984595)">at 378 enrolled</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="673.847496" y="313.998296" transform="rotate(-0 673.847496 313.998296)">371 / 303 evaluable (AUC / Ctrough)</text>
   </g>
  </g>
